<!DOCTYPE html>
<html lang="hy"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>amclothes ADMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;600&family=Noto+Sans+Armenian:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f3ee;--fg:#1d1a17;--card:#fff;--mut:#7b736a;--ac:#1d1a17;--gold:#a8834a;--bd:#e6dfd5;--red:#b8483a;--serif:"Noto Serif Armenian",Georgia,serif;--sans:"Noto Sans Armenian",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--fg:#f1ece4;--card:#1e1c19;--mut:#a39a8e;--ac:#f1ece4;--gold:#c9a266;--bd:#322f2a;--red:#e0705f}}
:root[data-theme="dark"]{--bg:#141311;--fg:#f1ece4;--card:#1e1c19;--mut:#a39a8e;--ac:#f1ece4;--gold:#c9a266;--bd:#322f2a;--red:#e0705f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5}
.top{background:var(--ac);color:var(--bg);text-align:center;font-size:12px;letter-spacing:.08em;padding:7px 10px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;gap:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--fg)}
.logo svg{width:44px;height:44px}.logo b{font-family:var(--serif);font-size:21px;letter-spacing:.22em;font-weight:600;display:block;line-height:1}
.logo small{font-size:9px;letter-spacing:.42em;color:var(--gold);display:block;margin-top:4px}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:14px;border:1px solid var(--ac);background:transparent;color:var(--fg);padding:9px 18px;border-radius:999px;cursor:pointer}
nav button{border-color:transparent}nav button:hover{border-color:var(--bd)}
button.p{background:var(--ac);color:var(--bg)}button.p:hover{opacity:.88}
.hero{padding:64px 22px;text-align:center;background:linear-gradient(135deg,var(--card),var(--bg));border-bottom:1px solid var(--bd);border-radius:0 0 36px 36px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,52px);margin:0 0 10px;letter-spacing:.04em}
.hero p{color:var(--mut);margin:0 0 22px}
main{max-width:1100px;margin:auto;padding:26px 22px 50px}
h2{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.04em;margin:0 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.chips button{border-color:var(--bd);padding:6px 16px}.chips button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:10px 10px 14px}
.card .im{position:relative;overflow:hidden;background:var(--bd);aspect-ratio:3/4;border-radius:16px}.card img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover img{transform:scale(1.04)}
.card.out img{filter:grayscale(1);opacity:.55}
.card>*:not(.im){margin-left:6px;margin-right:6px}
.card h3{margin:6px 0 0;font-size:15px;font-weight:500}.card .pr{font-family:var(--serif);font-size:17px}
.old{text-decoration:line-through;color:var(--mut);font-size:14px;margin-left:6px}
.card .ct{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.bd{position:absolute;top:10px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600}
.bd.l{left:10px;background:var(--red);color:#fff}.bd.r{right:10px;background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.buy{display:flex;gap:6px}.buy select{flex:1}
input,select,textarea{font:inherit;width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--fg);margin:4px 0 12px}
select{margin:0;padding:8px 12px}
label{font-size:13px;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--bd);padding:26px;max-width:520px;margin:auto;border-radius:26px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);align-items:center}
.row button{padding:3px 11px}
.mut{color:var(--mut);font-size:14px}.note{background:var(--bg);border:1px solid var(--bd);padding:10px 14px;font-size:13px;margin:12px 0;color:var(--mut);border-radius:14px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:40px;text-align:center;font-size:13px;color:var(--mut)}
.feat div{border:1px solid var(--bd);padding:14px;background:var(--card);border-radius:18px}.feat b{display:block;color:var(--fg);margin-bottom:2px}
footer{border-top:1px solid var(--bd);padding:26px 22px;text-align:center;color:var(--mut);font-size:13px}
footer a{color:var(--gold);text-decoration:none}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:10px 22px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
/* admin */
.adm .top,.adm footer,.adm .feat{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px 18px}.stats b{font-family:var(--serif);font-size:28px;display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.al{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.al img,.al .th{width:56px;height:70px;object-fit:cover;border-radius:12px;background:var(--bd)}
.al .in{flex:1;min-width:160px}.al select,.al input{width:auto;margin:0;padding:7px 10px;font-size:13px}.al input{width:78px}
</style></head><body>

 <div class="box" style="max-width:none"><h3 style="margin-top:0">Նոր ապրանք</h3><div class="two">
 <div><label>Անվանում</label><input id="a_n"></div><div><label>Կատեգորիա</label><input id="a_c" placeholder="Զգեստ, Վերնաշապիկ…"></div>
 <div><label>Գին (֏)</label><input id="a_p" type="number"></div><div><label>Զեղչ (%)</label><input id="a_d" type="number" min="0" max="90" value="0"></div>
 <div><label>Առկայություն</label><select id="a_t" style="margin-bottom:12px"><option value="in">Առկա է</option><option value="pre">Նախապատվեր</option><option value="out">Սպառվել է</option></select></div>
 <div><label>Նախապատվերի նշում</label><input id="a_o" placeholder="Առաքում 10 օր հետո"></div>
 <div><label>Չափսեր (ստորակետով)</label><input id="a_s" placeholder="S, M, L, XL"></div><div><label>Նկար</label><input id="a_i" type="file" accept="image/*"></div></div>
 <button class="p" onclick="addP()">Ավելացնել խանութ</button></div>
 <div class="box" style="max-width:none;margin-top:16px"><h3 style="margin-top:0">Ապրանքներ</h3>${P.map((x,i)=>`<div class="al">${x.img?`<img src="${x.img}" alt="">`:'<div class="th"></div>'}<div class="in"><b>${esc(x.name)}</b><br><span class="mut">${money(x.price)}${x.disc?' → '+money(fin(x)):''}</span></div>
 <select onchange="D.products[${i}].st=this.value"><option value="in"${(x.st||'in')==='in'?' selected':''}>Առկա</option><option value="pre"${x.st==='pre'?' selected':''}>Նախապատվեր</option><option value="out"${x.st==='out'?' selected':''}>Սպառված</option></select>
 <input type="number" min="0" max="90" value="${x.disc||0}" title="Զեղչ %" onchange="D.products[${i}].disc=Math.min(90,Math.max(0,+this.value||0))">%
 <button onclick="delP(${i})">Ջնջել</button></div>`).join('')||'<p class="mut">Դատարկ</p>'}
 ${P.length?'<p><button class="p" onclick="pub()">Պահպանել փոփոխությունները</button></p>':''}</div>`;
}
function img(f){return new Promise(r=>{if(!f)return r('');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};im.src=fr.result};fr.readAsDataURL(f)})}
async function addP(){
 const n=$('a_n').value.trim(),p=$('a_p').value;if(!n||!p){alert('Գրեք անունը և գինը');return}
 const s=$('a_s').value.split(',').map(x=>x.trim()).filter(Boolean);
 D.products.unshift({id:Date.now(),name:n,cat:$('a_c').value.trim(),price:+p,disc:Math.min(90,Math.max(0,+$('a_d').value||0)),st:$('a_t').value,note:$('a_o').value.trim(),sizes:s.length?s:['Ունիվերսալ'],img:await img($('a_i').files[0])});
 await pub();
}
async function delP(i){if(confirm('Ջնջե՞լ')){D.products.splice(i,1);await pub()}}
async function pub(){
 if(!art){alert('Հրապարակումը հասանելի չէ');return}
 const c=document.documentElement.cloneNode(true);
 c.removeAttribute('data-theme');c.querySelector('body').removeAttribute('class');
 c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
 c.querySelector('#app').innerHTML='';c.querySelector('#nav').innerHTML='';c.querySelector('#hero').innerHTML='';c.querySelector('#toast').className='';
 try{await art.publish('<!DOCTYPE html>\n'+c.outerHTML)}catch(e){if(e&&e.code!=='conflict')alert('Չհաջողվեց պահպանել')}
}
render();
(async()=>{try{const u=await claude.use('user');owner=!!(u&&u.isOwner());art=owner?await claude.use('artifact'):null}catch(e){}ready=true;render()})();
</script></body></html>
